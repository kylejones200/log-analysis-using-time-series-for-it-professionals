[project]
name = "log-analysis-using-time-series-for-it-professionals"
version = "0.1.0"
description = "Companion code for Medium article: log analysis using time series for it professionals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "statsmodels>=0.14.6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
